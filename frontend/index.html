<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fontawesome -->
  <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" />
  <!-- Bootswatch Darkly Theme -->
  <link href="https://stackpath.bootstrapcdn.com/bootswatch/4.5.2/darkly/bootstrap.min.css" rel="stylesheet" />
  <title>JS Todo List</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">JS Todo List</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
          <a class="nav-link" href="#">
            Home <span class="sr-only">(current)</span>
          </a>
        </li>
      </ul>
      <form class="form-inline my-2 my-lg-0" id="filters">
        <label class="font-weight-bold text-info mr-3">Filters</label>
        <input type="radio" name="type" value="active" class="mx-1" checked>
        <label class="mb-0">Active</label>
        <input type="radio" name="type" value="completed" class="mx-1">
        <label class="mb-0">Completed</label>
        <input type="radio" name="type" value="archived" class="mx-1">
        <label class="mr-2 mb-0">Archived</label>

        <input class="form-control mr-sm-2" type="search" name="words" placeholder="Words" aria-label="Search">
        <button class="btn btn-outline-info my-2 my-sm-0" type="submit" id="search">
          Search
        </button>
      </form>
    </div>
  </nav>

  <!-- Modal -->
  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            Edit Todo
          </h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none" role="alert" id="modal-alert">
            A simple danger alert—check it out!
          </div>
          <form>
            <div class="form-group">
              <label>Title</label>
              <input id="modal-title" type="text" class="form-control" placeholder="Do Something" />
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea class="form-control" id="modal-description" rows="3">

              </textarea>
            </div>
            <div class="form-group d-inline-flex">
              <label>Completed</label>
              <div class="mt-1 ml-2">
                <input id="modal-completed" type="checkbox" />
              </div>
            </div>
            <div class="form-group d-inline-flex ml-4">
              <label>Due Date</label>
              <div class="mt-1 ml-2">
                <input id="modal-due-date" type="date" />
              </div>
            </div>
            <div class="form-group d-inline-flex ml-2">
              <label>Due Time</label>
              <div class="mt-1 ml-2">
                <input id="modal-due-time" type="time" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">
            Close
          </button>
          <button type="button" class="btn btn-info" id="modal-btn">
            Save
          </button>
        </div>
      </div>
    </div>
  </div>

  <main>
    <div class="container pt-3">
      <div class="alert alert-danger d-none" role="alert" id="alert">
        A simple danger alert—check it out!
      </div>

      <div class="card mt-3 p-4" style="background-color: #2b2b2b; border-color: #444;">
        <h5 class="card-title mb-4" style="color: #fff;">Add New Task</h5>
        <form>
          <div class="form-group">
            <label for="title" class="font-weight-bold" style="color: #ccc;">Title</label>
            <input type="text" id="title" class="form-control" placeholder="e.g., Learn JS">
          </div>

          <div class="form-group">
            <label for="description" class="font-weight-bold" style="color: #ccc;">Description</label>
            <input type="text" id="description" class="form-control" placeholder="e.g., Watch JS Tutorials">
          </div>

          <div class="form-group">
            <div class="custom-control custom-checkbox">
              <input type="checkbox" class="custom-control-input" id="add-date-checkbox">
              <label class="custom-control-label font-weight-bold" for="add-date-checkbox" style="color: #ccc;">
                Add date and time?
              </label>
            </div>
          </div>

          <div id="date-time-fields" style="display: none;">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="due-date" class="font-weight-bold" style="color: #ccc;">Due Date</label>
                  <input type="date" id="due-date" class="form-control">
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="due-time" class="font-weight-bold" style="color: #ccc;">Due Time</label>
                  <input type="time" id="due-time" class="form-control">
                </div>
              </div>
            </div>
          </div>

          <button type="button" class="btn btn-primary btn-lg btn-block" id="add">
            <i class="fa fa-plus mr-2"></i>Add Task
          </button>
        </form>
      </div>

      <div class="mt-5">
        <table class="table table-striped" id="table">
          <thead>
            <tr>
              <th scope="col">Todo</th>
              <th scope="col">Description</th>
              <th scope="col">Due Date/Time</th>
              <th scope="col">
                <div class="d-flex justify-content-center">
                  Completed
                </div>
              </th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            <!-- Content generated with JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- JQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha256-4+XzXVhsDmqanXGHaHvgh1gMQKX40OUvDEBTu8JcmNs=" crossorigin="anonymous"></script>
  <!-- Bootstrap -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
  <!-- JS Code -->
  <!-- JS Code -->
  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
